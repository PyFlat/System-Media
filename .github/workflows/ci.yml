name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Each platform builds and tests its own backend natively; the shared core is tested on both.
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: osx-arm64
            os: macos-latest
          - rid: linux-x64
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SystemMedia.slnx

      - name: Build
        run: dotnet build SystemMedia.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SystemMedia.slnx --no-build --configuration Release

      - name: Install macrodeck-plugin CLI
        run: dotnet tool install --global MacroDeck.Plugin.Cli --version 3.0.0-beta.15

      - name: Build the ${{ matrix.rid }} package
        run: macrodeck-plugin build --source src/SystemMedia --rid ${{ matrix.rid }} --output ./artifacts

      # Warns early when a macOS or media-control update breaks what the macOS backend relies on. A runner
      # has no media playing, so `get` printing null is the expected success.
      - name: Check the current media-control
        if: matrix.rid == 'osx-arm64'
        run: |
          brew install media-control
          media-control test
          media-control get

      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.rid }}
          path: artifacts/*.macroDeckPlugin
          retention-days: 7
